<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />

        <link rel="stylesheet" href="../../normalize.css?v=5" />

                <button id="words">Switch to dwyl 400k</button>
            </div>
        </main>
        <footer></footer>

        <script src="main.mjs" type="module"></script>
